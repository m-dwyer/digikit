[project]
name = "digitakt2"
version = "0.1.0"
description = "Digitakt II OS 1.15C: container tooling, ColdFire disassembly, and a Unicorn emulator"
# GPL because patches/ carries a diff against QEMU source vendored inside
# Unicorn, and emu.unicorn_compat refuses to run without it. See README.
license = "GPL-2.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "unicorn==2.1.4",
    "capstone==5.0.7",
    "pypcode==4.0.0",
    "networkx==3.4.2",
]

# Pinned to 3.12 deliberately. On 3.14 (the Homebrew default here) binary
# wheels are still thin -- pygame, for one, resolves to an sdist and has to
# compile -- and Homebrew's python@3.14 has no tkinter at all. uv's managed
# CPython builds bundle tkinter, so the GUI in emu/gui.py works with no
# system packages installed.

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest>=8",
    "ruff==0.16.9",
]

[tool.uv]
package = false

# Pinned here so ruff gives the same answer on every machine, whatever the
# user-level ruff configuration says. tests/test_lint.py enforces these rules
# and the formatter on the files listed there; add a file to that list when
# you clean it.
[tool.ruff]
line-length = 88
target-version = "py312"
# tools/ modules import each other as top-level modules (sys.path setup).
src = [".", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # line length is the formatter's job
    "UP031",  # %-formatting is the house style
]

# tests/test_types.py runs mypy on the files listed there. The SHARC core
# also runs under PyPy, which supports Python 3.11, so check against 3.11.
[tool.mypy]
python_version = "3.11"
mypy_path = "tools"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"
warn_unused_ignores = true
